group 'com.segment.analytics'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.7.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.segment.analytics'
    compileSdkVersion 35 //Patch for for Github issue #147

    // This module's namespace collides with the native Segment SDK
    // (com.segment.analytics.kotlin:android), which generates its own
    // com.segment.analytics.BuildConfig — R8 then fails a minified build on the
    // duplicate type. Nothing here references BuildConfig, so suppressing it
    // lets both SDKs ship in one binary during the native-SDK rollout.
    buildFeatures {
        buildConfig false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 16
    }
}